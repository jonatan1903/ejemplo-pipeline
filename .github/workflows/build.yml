name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: catnip
      DOCKER_USER: jonatan0218   # o el usuario de Docker Hub correspondiente
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -f ./Dockerfile -t ${{ env.DOCKER_USER }}/${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }} -t ${{ env.DOCKER_USER }}/${{ env.IMAGE }}:latest .

      # los pull requests solo construyen la imagen; no publican :latest
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.DOCKER_USER }}/${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
          docker push ${{ env.DOCKER_USER }}/${{ env.IMAGE }}:latest